<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Habit Tracker</title>
    <meta name="theme-color" content="#4a6fa5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%234a6fa5'/%3E%3Crect x='15' y='38' width='18' height='24' rx='4' fill='white'/%3E%3Crect x='67' y='38' width='18' height='24' rx='4' fill='white'/%3E%3Crect x='33' y='42' width='34' height='16' rx='4' fill='white'/%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #f5f3ef; --card-bg: #ffffff; --text: #1e1e1e; --text-secondary: #6e6e6e;
            --border: #e0dcd4; --accent: #4a6fa5; --shadow: 0 2px 14px rgba(0,0,0,0.05); --radius: 14px;
            --font: 'Inter', system-ui, sans-serif; --danger: #e74c3c;
            --input-bg: #fafaf7; --hover-bg: #f0ede6;
        }
        [data-theme="dark"] {
            --bg: #1a1a2e; --card-bg: #16213e; --text: #e0e0e0; --text-secondary: #a0a0a0;
            --border: #2a2a4a; --shadow: 0 2px 14px rgba(0,0,0,0.3); --input-bg: #1a1a2e; --hover-bg: #2a2a4a;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; padding: 12px; }
        .app { max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        .header { display: flex; align-items: center; gap: 10px; background: var(--card-bg); padding: 10px 14px; border-radius: var(--radius); box-shadow: var(--shadow); }
        .back-btn { background: none; border: none; cursor: pointer; font-size: 1.4rem; color: var(--accent); text-decoration: none; }
        .header-title { font-size: 1.15rem; font-weight: 700; flex: 1; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .date-display { font-size: 1rem; font-weight: 700; cursor: pointer; }
        .calendar-icon { background: none; border: none; cursor: pointer; font-size: 1.5rem; color: var(--accent); }
        .add-btn { background: var(--accent); border: none; cursor: pointer; font-size: 1.3rem; width: 36px; height: 36px; border-radius: 10px; color: #fff; }
        .card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; }
        .habit-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--input-bg); margin-bottom: 4px; }
        .color-dot { width: 14px; height: 14px; border-radius: 50%; }
        .habit-text { flex: 1; font-size: 0.95rem; font-weight: 600; }
        .habit-item.done .habit-text { text-decoration: line-through; color: var(--text-secondary); }
        .habit-radio { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid #d5d0c7; cursor: pointer; }
        .habit-item.done .habit-radio { background: var(--accent); border-color: var(--accent); }
        .delete-btn { background: none; border: none; cursor: pointer; color: var(--danger); font-size: 1rem; }
        .stats-bar { display: flex; gap: 8px; }
        .stat-card { background: var(--card-bg); padding: 12px 14px; border-radius: var(--radius); box-shadow: var(--shadow); text-align: center; flex: 1; }
        .stat-value { font-size: 1.3rem; font-weight: 800; color: var(--accent); }
        .stat-label { font-size: 0.65rem; color: var(--text-secondary); }
        .chart-container { height: 180px; }
        .hidden-date-input { position: absolute; opacity: 0; width: 0; height: 0; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; display: flex; align-items: flex-start; justify-content: center; padding-top: 20px; }
        .modal-box { background: var(--card-bg); border-radius: 16px; padding: 20px; width: 90%; max-width: 380px; }
        .modal-box h3 { font-size: 1.1rem; margin-bottom: 16px; }
        .modal-row { display: flex; gap: 10px; margin-bottom: 14px; }
        .modal-row input[type="text"] { flex: 1; padding: 10px 14px; border-radius: 22px; border: 1.5px solid var(--border); font-size: 0.9rem; }
        .color-presets { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
        .color-preset { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; }
        .color-preset.selected { border-color: var(--text); }
        .modal-actions { display: flex; gap: 8px; justify-content: center; }
        .btn { padding: 10px 18px; border-radius: 22px; border: none; cursor: pointer; font-weight: 600; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-outline { background: var(--card-bg); border: 1.5px solid var(--border); }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <a href="index.html" class="back-btn">←</a>
            <div class="header-title">🏋️ Habit Tracker</div>
            <div class="header-right">
                <button class="add-btn" onclick="openAddHabitModal()">+</button>
                <div class="date-display" id="dateDisplay" onclick="openDatePicker()"></div>
                <button class="calendar-icon" onclick="goToToday()">📅</button>
            </div>
            <input type="date" id="datePicker" class="hidden-date-input" onchange="onDateChange(this.value)">
        </div>

        <div class="card"><div id="habitList"></div></div>
        <div class="stats-bar" id="statsBar"></div>
        <div class="card"><canvas id="habitChart"></canvas></div>
    </div>

    <div class="modal-overlay" id="addHabitModal" style="display:none;">
        <div class="modal-box">
            <h3>➕ Add New Habit</h3>
            <div class="modal-row"><input type="text" id="habitNameInput" placeholder="Habit name..." onkeypress="if(event.key==='Enter') addHabit()"></div>
            <div class="color-presets" id="colorPresets"></div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeAddHabitModal()">Cancel</button>
                <button class="btn btn-primary" onclick="addHabit()">Add</button>
            </div>
        </div>
    </div>

    <script src="shared.js"></script>
    <script>
        let selectedDate = new Date();
        let chartInstance = null;
        let selectedColor = '#4a6fa5';
        const COLOR_PRESETS = ['#4a6fa5', '#e74c3c', '#2ecc71', '#f39c12', '#9b59b6', '#1abc9c', '#e67e22', '#3498db', '#e91e63', '#00bcd4'];

        function openDatePicker() { document.getElementById('datePicker').showPicker ? document.getElementById('datePicker').showPicker() : document.getElementById('datePicker').click(); }
        function openAddHabitModal() { document.getElementById('addHabitModal').style.display = 'flex'; renderColorPresets(); }
        function closeAddHabitModal() { document.getElementById('addHabitModal').style.display = 'none'; }
        function renderColorPresets() { document.getElementById('colorPresets').innerHTML = COLOR_PRESETS.map(c => `<div class="color-preset ${c===selectedColor?'selected':''}" style="background:${c}" onclick="selectColor('${c}')"></div>`).join(''); }
        function selectColor(c) { selectedColor = c; renderColorPresets(); }

        function render() {
            document.getElementById('datePicker').value = selectedDate.toISOString().split('T')[0];
            document.getElementById('dateDisplay').textContent = selectedDate.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short' });
            const habits = appData.habits.habits || [];
            const key = dateKey(selectedDate);
            const completions = appData.habits.completions || {};
            document.getElementById('habitList').innerHTML = habits.length === 0 ? '<div style="text-align:center;color:var(--text-secondary);padding:15px;">No habits. Tap + to add.</div>' : habits.map(h => {
                const done = completions[h.id]?.[key];
                return `<div class="habit-item ${done?'done':''}"><div class="color-dot" style="background:${h.color}"></div><span class="habit-text">${escapeHTML(h.name)}</span><div class="habit-radio" onclick="toggleHabit('${h.id}')"></div><button class="delete-btn" onclick="deleteHabit('${h.id}')">×</button></div>`;
            }).join('');
            const doneToday = habits.filter(h => completions[h.id]?.[key]).length;
            document.getElementById('statsBar').innerHTML = `<div class="stat-card"><div class="stat-label">Total</div><div class="stat-value">${habits.length}</div></div><div class="stat-card"><div class="stat-label">Done Today</div><div class="stat-value">${doneToday}</div></div>`;
            renderChart();
        }

        function addHabit() {
            const name = document.getElementById('habitNameInput').value.trim();
            if (!name) return;
            const id = Date.now().toString(36);
            appData.habits.habits = appData.habits.habits || [];
            appData.habits.habits.push({ id, name, color: selectedColor });
            appData.habits.completions = appData.habits.completions || {};
            appData.habits.completions[id] = {};
            saveDataLocal();
            closeAddHabitModal(); render();
        }
        function toggleHabit(id) {
            const key = dateKey(selectedDate);
            appData.habits.completions = appData.habits.completions || {};
            appData.habits.completions[id] = appData.habits.completions[id] || {};
            if (appData.habits.completions[id][key]) delete appData.habits.completions[id][key];
            else appData.habits.completions[id][key] = true;
            saveDataLocal(); render();
        }
        function deleteHabit(id) {
            appData.habits.habits = (appData.habits.habits || []).filter(h => h.id !== id);
            saveDataLocal(); render();
        }
        function onDateChange(v) { selectedDate = new Date(v + 'T00:00:00'); render(); }
        function goToToday() { selectedDate = new Date(); render(); }
        function renderChart() {
            const ctx = document.getElementById('habitChart'); if (!ctx) return;
            if (chartInstance) chartInstance.destroy();
            const m = selectedDate.getMonth(), y = selectedDate.getFullYear(), dim = new Date(y, m+1, 0).getDate();
            const data = []; for (let d = 1; d <= dim; d++) data.push((appData.habits.habits || []).filter(h => (appData.habits.completions?.[h.id] || {})[dateKey(new Date(y,m,d))]).length);
            chartInstance = new Chart(ctx, { type: 'bar', data: { labels: Array.from({length: dim}, (_,i)=>i+1), datasets: [{ data, backgroundColor: 'rgba(74,111,165,0.6)', borderRadius: 4 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } } });
        }

        initSync();
        render();
        renderColorPresets();
    </script>
</body>
</html>
