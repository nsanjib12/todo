<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Expense Tracker</title>
    <meta name="theme-color" content="#4a6fa5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%234a6fa5'/%3E%3Ccircle cx='35' cy='40' r='12' fill='white'/%3E%3Ccircle cx='65' cy='40' r='12' fill='white'/%3E%3Ccircle cx='50' cy='65' r='12' fill='white'/%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #f5f3ef; --card-bg: #ffffff; --text: #1e1e1e; --text-secondary: #6e6e6e;
            --border: #e0dcd4; --accent: #4a6fa5; --shadow: 0 2px 14px rgba(0,0,0,0.05); --radius: 14px;
            --font: 'Inter', system-ui, sans-serif; --danger: #e74c3c; --success: #2ecc71;
            --input-bg: #fafaf7; --hover-bg: #f0ede6;
        }
        [data-theme="dark"] {
            --bg: #1a1a2e; --card-bg: #16213e; --text: #e0e0e0; --text-secondary: #a0a0a0;
            --border: #2a2a4a; --shadow: 0 2px 14px rgba(0,0,0,0.3); --input-bg: #1a1a2e; --hover-bg: #2a2a4a;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; padding: 12px; }
        .app { max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        .header { display: flex; align-items: center; gap: 10px; background: var(--card-bg); padding: 10px 14px; border-radius: var(--radius); box-shadow: var(--shadow); }
        .back-btn { background: none; border: none; cursor: pointer; font-size: 1.4rem; color: var(--accent); text-decoration: none; }
        .header-title { font-size: 1.15rem; font-weight: 700; flex: 1; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .date-display { font-size: 1rem; font-weight: 700; cursor: pointer; }
        .calendar-icon { background: none; border: none; cursor: pointer; font-size: 1.5rem; color: var(--accent); }
        .add-btn { background: var(--accent); border: none; cursor: pointer; font-size: 1.3rem; width: 36px; height: 36px; border-radius: 10px; color: #fff; }
        .card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; }
        .expense-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--input-bg); margin-bottom: 4px; }
        .expense-info { flex: 1; }
        .expense-desc { font-weight: 600; font-size: 0.9rem; }
        .expense-cat { font-size: 0.7rem; color: var(--text-secondary); }
        .expense-amount { font-weight: 700; }
        .expense-amount.positive { color: var(--success); }
        .expense-amount.negative { color: var(--danger); }
        .delete-btn { background: none; border: none; cursor: pointer; color: var(--danger); }
        .stats-bar { display: flex; gap: 8px; }
        .stat-card { background: var(--card-bg); padding: 12px 14px; border-radius: var(--radius); box-shadow: var(--shadow); text-align: center; flex: 1; }
        .stat-value { font-size: 1.3rem; font-weight: 800; }
        .stat-value.positive { color: var(--success); }
        .stat-value.negative { color: var(--danger); }
        .stat-label { font-size: 0.65rem; color: var(--text-secondary); }
        .chart-container { height: 180px; }
        .hidden-date-input { position: absolute; opacity: 0; width: 0; height: 0; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; display: flex; align-items: flex-start; justify-content: center; padding-top: 20px; }
        .modal-box { background: var(--card-bg); border-radius: 16px; padding: 20px; width: 90%; max-width: 400px; }
        .modal-box h3 { font-size: 1.1rem; margin-bottom: 16px; }
        .modal-field { margin-bottom: 12px; }
        .modal-field label { display: block; font-size: 0.7rem; font-weight: 600; margin-bottom: 4px; }
        .modal-field input, .modal-field select { width: 100%; padding: 10px 14px; border-radius: 20px; border: 1.5px solid var(--border); font-size: 0.9rem; }
        .modal-row { display: flex; gap: 10px; }
        .modal-row .modal-field { flex: 1; }
        .modal-actions { display: flex; gap: 8px; justify-content: center; }
        .btn { padding: 10px 18px; border-radius: 22px; border: none; cursor: pointer; font-weight: 600; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-outline { background: var(--card-bg); border: 1.5px solid var(--border); }
        .monthly-summary { display: flex; gap: 10px; }
        .summary-card { flex: 1; padding: 14px 10px; border-radius: var(--radius); background: var(--input-bg); text-align: center; }
        .summary-value { font-size: 1.2rem; font-weight: 700; }
        .summary-label { font-size: 0.65rem; color: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <a href="index.html" class="back-btn">←</a>
            <div class="header-title">💳 Expense Tracker</div>
            <div class="header-right">
                <button class="add-btn" onclick="openAddExpenseModal()">+</button>
                <div class="date-display" id="dateDisplay" onclick="openDatePicker()"></div>
                <button class="calendar-icon" onclick="goToToday()">📅</button>
            </div>
            <input type="date" id="datePicker" class="hidden-date-input" onchange="onDateChange(this.value)">
        </div>

        <div class="stats-bar" id="statsBar"></div>
        <div class="card"><div id="expenseList"></div></div>
        <div class="card"><canvas id="expenseChart"></canvas><div class="monthly-summary" id="monthlySummary"></div></div>
    </div>

    <div class="modal-overlay" id="addExpenseModal" style="display:none;">
        <div class="modal-box">
            <h3>💳 Add Transaction</h3>
            <div class="modal-field"><label>Description</label><input type="text" id="expenseDesc" placeholder="What was it for?"></div>
            <div class="modal-row">
                <div class="modal-field"><label>Amount</label><input type="number" id="expenseAmount" placeholder="0.00"></div>
                <div class="modal-field"><label>Type</label><select id="expenseType"><option value="expense">Expense</option><option value="income">Income</option></select></div>
            </div>
            <div class="modal-field"><label>Category</label><select id="expenseCategory"><option>Food</option><option>Transport</option><option>Shopping</option><option>Bills</option><option>Entertainment</option><option>Health</option><option>Salary</option><option>Other</option></select></div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeAddExpenseModal()">Cancel</button>
                <button class="btn btn-primary" onclick="addExpense()">Add</button>
            </div>
        </div>
    </div>

    <script src="shared.js"></script>
    <script>
        let selectedDate = new Date();
        let chartInstance = null;

        function openDatePicker() { document.getElementById('datePicker').showPicker ? document.getElementById('datePicker').showPicker() : document.getElementById('datePicker').click(); }
        function openAddExpenseModal() { document.getElementById('addExpenseModal').style.display = 'flex'; }
        function closeAddExpenseModal() { document.getElementById('addExpenseModal').style.display = 'none'; }

        function render() {
            document.getElementById('datePicker').value = selectedDate.toISOString().split('T')[0];
            document.getElementById('dateDisplay').textContent = selectedDate.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short' });
            const key = dateKey(selectedDate);
            const txns = (appData.expenses.transactions || []).filter(t => t.date === key);
            const dayIncome = txns.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
            const dayExpense = txns.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
            document.getElementById('statsBar').innerHTML = `<div class="stat-card"><div class="stat-label">Income</div><div class="stat-value positive">₹${dayIncome}</div></div><div class="stat-card"><div class="stat-label">Expense</div><div class="stat-value negative">₹${dayExpense}</div></div>`;
            document.getElementById('expenseList').innerHTML = txns.length === 0 ? '<div style="text-align:center;padding:15px;">No transactions.</div>' : txns.map(t => `<div class="expense-item"><div class="expense-info"><div class="expense-desc">${escapeHTML(t.description)}</div><div class="expense-cat">${t.category}</div></div><div class="expense-amount ${t.type==='income'?'positive':'negative'}">${t.type==='income'?'+':'-'}₹${t.amount}</div><button class="delete-btn" onclick="deleteExpense('${t.id}')">×</button></div>`).join('');
            renderChart();
        }

        function addExpense() {
            const amount = parseFloat(document.getElementById('expenseAmount').value);
            const desc = document.getElementById('expenseDesc').value.trim() || 'No desc';
            const type = document.getElementById('expenseType').value;
            const category = document.getElementById('expenseCategory').value;
            if (!amount) return;
            appData.expenses.transactions = appData.expenses.transactions || [];
            appData.expenses.transactions.push({ id: Date.now().toString(36), date: dateKey(selectedDate), amount, description: desc, type, category });
            saveDataLocal();
            closeAddExpenseModal(); render();
        }
        function deleteExpense(id) {
            appData.expenses.transactions = (appData.expenses.transactions || []).filter(t => t.id !== id);
            saveDataLocal(); render();
        }
        function onDateChange(v) { selectedDate = new Date(v + 'T00:00:00'); render(); }
        function goToToday() { selectedDate = new Date(); render(); }
        function renderChart() {
            const ctx = document.getElementById('expenseChart'); if (!ctx) return;
            if (chartInstance) chartInstance.destroy();
            const m = selectedDate.getMonth(), y = selectedDate.getFullYear(), dim = new Date(y, m+1, 0).getDate();
            const dailyExp = [], dailyInc = [];
            let totalInc = 0, totalExp = 0;
            for (let d = 1; d <= dim; d++) {
                const dayTx = (appData.expenses.transactions || []).filter(t => t.date === dateKey(new Date(y,m,d)));
                const inc = dayTx.filter(t => t.type === 'income').reduce((s,t) => s + t.amount, 0);
                const exp = dayTx.filter(t => t.type === 'expense').reduce((s,t) => s + t.amount, 0);
                dailyInc.push(inc); dailyExp.push(exp);
                totalInc += inc; totalExp += exp;
            }
            chartInstance = new Chart(ctx, { type: 'bar', data: { labels: Array.from({length: dim}, (_,i)=>i+1), datasets: [{ label: 'Expense', data: dailyExp, backgroundColor: 'rgba(231,76,60,0.6)' }, { label: 'Income', data: dailyInc, backgroundColor: 'rgba(46,204,113,0.6)' }] }, options: { responsive: true, maintainAspectRatio: false } });
            document.getElementById('monthlySummary').innerHTML = `<div class="summary-card"><div class="summary-value positive">₹${totalInc}</div><div class="summary-label">Income</div></div><div class="summary-card"><div class="summary-value negative">₹${totalExp}</div><div class="summary-label">Expenses</div></div><div class="summary-card"><div class="summary-value">₹${totalInc-totalExp}</div><div class="summary-label">Balance</div></div>`;
        }

        initSync();
        render();
    </script>
</body>
</html>
