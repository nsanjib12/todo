    <style>
        :root {
            --bg: #f5f3ef;
            --card-bg: #ffffff;
            --text: #1e1e1e;
            --text-secondary: #6e6e6e;
            --border: #e0dcd4;
            --accent: #4a6fa5;
            --today-highlight: #e0b94a;
            --shadow: 0 2px 14px rgba(0,0,0,0.05);
            --radius: 14px;
            --font: 'Inter', 'Segoe UI', system-ui, sans-serif;
            --danger: #e74c3c;
            --success: #2ecc71;
            --input-bg: #fafaf7;
            --hover-bg: #f0ede6;
            --modal-bg: rgba(0,0,0,0.45);
        }

        [data-theme="dark"] {
            --bg: #1a1a2e;
            --card-bg: #16213e;
            --text: #e0e0e0;
            --text-secondary: #a0a0a0;
            --border: #2a2a4a;
            --shadow: 0 2px 14px rgba(0,0,0,0.3);
            --input-bg: #1a1a2e;
            --hover-bg: #2a2a4a;
            --modal-bg: rgba(0,0,0,0.7);
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            transition: background 0.3s, color 0.3s;
        }
        .app-container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 16px 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-left { display:flex; align-items:center; gap:12px; }
        .logo { font-size:1.8rem; }
        .title { font-size:1.4rem; font-weight:700; letter-spacing:-0.02em; }
        .subtitle { font-size:0.78rem; color:var(--text-secondary); }
        .header-actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.4rem;
            padding: 6px;
            border-radius: 8px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            color: var(--text);
        }
        .icon-btn:hover { background: var(--hover-bg); }
        .btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            font-family: var(--font);
            color: var(--text);
        }
        .btn-primary { background: var(--accent); color:#fff; border-color:var(--accent); }
        .btn-primary:hover { opacity: 0.9; }
        .btn-outline:hover { background: var(--hover-bg); }
        .today-btn { border-color: var(--today-highlight); background: #fffdf5; color: #8a6d20; }
        [data-theme="dark"] .today-btn { background: #2a2010; color: #e0b94a; }
        .today-btn:hover { opacity: 0.9; }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px 24px;
        }

        .home-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }
        .home-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }
        .home-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            border-color: var(--accent);
        }
        .home-card .icon { font-size: 3rem; margin-bottom: 12px; }
        .home-card .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 6px; }
        .home-card .card-desc { font-size: 0.85rem; color: var(--text-secondary); }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent);
            cursor: pointer;
            margin-bottom: 8px;
            background: none;
            border: none;
            font-family: var(--font);
        }

        .week-strip { display: flex; align-items: center; gap: 8px; overflow-x: auto; }
        .nav-arrow {
            font-size: 1.4rem;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            color: var(--text);
            border-radius: 8px;
            flex-shrink: 0;
        }
        .nav-arrow:hover { background: var(--hover-bg); }
        .week-days { display: flex; flex: 1; gap: 4px; }
        .week-day {
            flex: 1 1 0;
            min-width: 0;
            padding: 8px 2px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
            border: 2px solid transparent;
            background: var(--input-bg);
            user-select: none;
        }
        .week-day:hover { background: var(--hover-bg); border-color: var(--accent); }
        .week-day.today { border-color: var(--today-highlight); background: #fffdf5; }
        [data-theme="dark"] .week-day.today { background: #2a2010; }
        .week-day.selected { border-color: var(--accent); }
        .week-day .day-name { font-size:0.65rem; color:var(--text-secondary); text-transform:uppercase; }
        .week-day .day-num { font-size:0.95rem; font-weight:700; }

        .task-item, .habit-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            background: var(--input-bg);
            margin-bottom: 4px;
            transition: 0.2s;
        }
        .task-item:hover, .habit-row:hover { background: var(--hover-bg); }
        .task-radio {
            width: 26px; height: 26px;
            border-radius: 50%;
            border: 2.5px solid #d5d0c7;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            background: var(--card-bg);
            flex-shrink: 0;
        }
        .task-item.done .task-radio { border-color: transparent; background: var(--accent); }
        .task-radio .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #fff;
            transform: scale(0);
            transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
        }
        .task-item.done .task-radio .dot { transform: scale(1); }
        .task-text { flex: 1; font-size: 1rem; font-weight: 600; }
        .task-item.done .task-text { text-decoration: line-through; color: var(--text-secondary); }
        .task-delete {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--danger);
            font-size: 1.1rem;
            font-weight: 700;
            opacity: 0;
            transition: 0.2s;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .task-item:hover .task-delete, .habit-row:hover .task-delete { opacity: 1; }
        .task-delete:hover { background: #fce8e8; }
        .add-row { display: flex; gap: 10px; margin-top: 12px; }
        .add-row input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1.5px solid var(--border);
            font-size: 0.95rem;
            font-family: var(--font);
            background: var(--input-bg);
            color: var(--text);
        }
        .add-row input:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 3px rgba(74,111,165,0.1);
        }
        .add-row select {
            padding: 12px 16px;
            border-radius: 24px;
            border: 1.5px solid var(--border);
            font-family: var(--font);
            background: var(--input-bg);
            color: var(--text);
            font-size: 0.9rem;
        }

        .stats-bar { display: flex; gap: 10px; align-items: stretch; margin-top: 12px; }
        .stat-card {
            background: var(--card-bg);
            padding: 14px 18px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
            flex: 0 0 auto;
            min-width: 0;
        }
        .stat-card.progress-card { flex: 1 1 0%; text-align: left; }
        .stat-value { font-size: 1.6rem; font-weight: 800; color: var(--accent); line-height: 1.2; }
        .stat-label { font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; white-space: nowrap; }
        .chart-container { height: 200px; }

        /* Expense specific */
        .expense-item { display: flex; align-items: center; gap: 10px; }
        .expense-amount { font-weight: 700; min-width: 80px; text-align: right; }
        .expense-amount.positive { color: var(--success); }
        .expense-amount.negative { color: var(--danger); }
        .expense-category { font-size: 0.75rem; color: var(--text-secondary); min-width: 70px; }

        /* Settings */
        .settings-panel {
            position: absolute;
            top: 70px;
            right: 20px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 36px rgba(0,0,0,0.15);
            padding: 16px;
            width: 310px;
            display: none;
            z-index: 50;
            font-size: 0.85rem;
            color: var(--text);
        }
        .settings-panel.show { display: block; }
        .sync-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .sync-dot.online { background: var(--success); }
        .sync-dot.offline { background: var(--danger); }
        .sync-dot.syncing { background: #ff9800; animation: pulse 1s infinite; }
        @keyframes pulse { 0%{opacity:1;} 50%{opacity:0.4;} 100%{opacity:1;} }
        .settings-section { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }
        .settings-row { display: flex; gap: 6px; margin-top: 10px; }
        .settings-row input {
            flex:1; padding:6px 10px;
            border-radius: 14px;
            border:1px solid var(--border);
            font-size:0.75rem;
            background: var(--input-bg);
            color: var(--text);
        }
        .small-btn {
            padding:4px 12px;
            font-size:0.75rem;
            border-radius:14px;
            border:1px solid var(--border);
            background: var(--card-bg);
            cursor:pointer;
            font-weight:600;
            white-space: nowrap;
            color: var(--text);
        }
        .small-btn:hover { background: var(--hover-bg); }

        .theme-toggle { display: flex; gap: 6px; margin-top: 10px; }
        .theme-option {
            flex: 1;
            padding: 6px 10px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            text-align: center;
            color: var(--text);
        }
        .theme-option.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .header { padding: 12px 14px; }
            .title { font-size:1.2rem; }
            .home-grid { grid-template-columns: 1fr; }
            .week-day .day-num { font-size:0.8rem; }
            .chart-container { height: 180px; }
        }
    </style>
</head>
<body>
    <div class="app-container" id="appContainer">
        <!-- Content loaded dynamically -->
    </div>

    <script>
        // ─────────────── Theme Manager ───────────────
        const themeManager = {
            get() { return localStorage.getItem('lifeTrackerTheme') || 'system'; },
            set(theme) {
                localStorage.setItem('lifeTrackerTheme', theme);
                this.apply();
            },
            apply() {
                const theme = this.get();
                if (theme === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                } else if (theme === 'light') {
                    document.documentElement.removeAttribute('data-theme');
                } else {
                    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                        document.documentElement.setAttribute('data-theme', 'dark');
                    } else {
                        document.documentElement.removeAttribute('data-theme');
                    }
                }
            }
        };

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if (themeManager.get() === 'system') themeManager.apply();
        });
        themeManager.apply();

        // ─────────────── JSONBlob Sync ───────────────
        const JSONBLOB_API = 'https://jsonblob.com/api/jsonBlob';
        const BLOB_ID_KEY = 'lifeTrackerBlobId';
        let blobId = null;
        let syncInProgress = false;

        function getSavedBlobId() { return localStorage.getItem(BLOB_ID_KEY); }
        function saveBlobId(id) { localStorage.setItem(BLOB_ID_KEY, id); }

        async function createBlob(data) {
            const resp = await fetch(JSONBLOB_API, {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify(data)
            });
            if (!resp.ok) throw new Error('Create failed');
            const location = resp.headers.get('Location');
            return location.split('/').pop();
        }
        async function fetchBlob(id) {
            const resp = await fetch(`${JSONBLOB_API}/${id}`);
            if (!resp.ok) throw new Error('Fetch failed');
            return await resp.json();
        }
        async function updateBlob(id, data) {
            await fetch(`${JSONBLOB_API}/${id}`, {
                method: 'PUT',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify(data)
            });
        }
        async function syncToCloud() {
            if (!blobId || syncInProgress) return;
            syncInProgress = true;
            try {
                await updateBlob(blobId, appData);
                updateSyncUI('online', 'Saved online');
            } catch(e) {
                console.warn('Sync failed', e);
                updateSyncUI('offline', 'Offline');
            } finally { syncInProgress = false; }
        }
        async function loadFromCloud() {
            if (!blobId) return;
            updateSyncUI('syncing', 'Loading...');
            try {
                appData = await fetchBlob(blobId);
                updateSyncUI('online', 'Online');
            } catch(e) {
                console.warn('Load failed');
                updateSyncUI('offline', 'Offline');
            }
        }
        function updateSyncUI(state, text) {
            const dot = document.getElementById('syncDot');
            const txt = document.getElementById('syncText');
            if (dot) dot.className = 'sync-dot ' + state;
            if (txt) txt.textContent = text;
        }

        // ─────────────── App Data ───────────────
        let appData = {
            todo: { tasks: {} },
            habits: { habits: [], completions: {} },
            expenses: { transactions: [] }
        };
        let currentPage = 'home';
        let selectedDate = new Date();
        let weekCenter = new Date();
        const today = new Date();
        today.setHours(0,0,0,0);

        function saveData() {
            localStorage.setItem('lifeTrackerLocal', JSON.stringify(appData));
            syncToCloud();
        }

        // ─────────────── Helpers ───────────────
        function dateKey(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth()+1).padStart(2,'0');
            const day = String(d.getDate()).padStart(2,'0');
            return `${y}-${m}-${day}`;
        }
        function getMonthName(m) {
            return ['January','February','March','April','May','June','July','August','September','October','November','December'][m];
        }
        function formatDate(d) {
            return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
        }

        // ─────────────── Navigation ───────────────
        function navigateTo(page) {
            currentPage = page;
            if (page === 'todo' || page === 'habits' || page === 'expenses') {
                selectedDate = new Date(today);
                weekCenter = new Date(today);
            }
            render();
        }

        // ─────────────── Render Main ───────────────
        function render() {
            const container = document.getElementById('appContainer');
            switch(currentPage) {
                case 'home': renderHome(container); break;
                case 'todo': renderTodo(container); break;
                case 'habits': renderHabits(container); break;
                case 'expenses': renderExpenses(container); break;
            }
        }

        function getHeaderHTML(title, subtitle, showBack = true, showToday = false, showReminder = false) {
            return `
                <div class="header">
                    <div class="header-left">
                        ${showBack ? '<button class="back-btn" onclick="navigateTo(\'home\')">← Home</button>' : ''}
                        <div>
                            <div class="title">${title}</div>
                            <div class="subtitle">${subtitle}</div>
                        </div>
                    </div>
                    <div class="header-actions">
                        ${showToday ? '<button class="today-btn btn" onclick="goToToday()">📍 Today</button>' : ''}
                        ${showReminder ? '<button class="icon-btn" id="reminderToggleBtn" onclick="toggleReminder()">🔔<span class="badge" id="reminderBadge" style="display:none;"></span></button>' : ''}

        function renderSettingsPanel() {

                    <div id="recoveryIdContainer" style="display:none; gap:6px; margin-bottom:6px;">

                        <button class="small-btn" onclick="copyBlobId()">📋</button>

                    <div style="display:flex; gap:6px; margin-bottom:6px;">

                        <button class="small-btn" onclick="recoverWithId()">Load</button>

                    <div class="settings-section">
                        <div style="font-weight:700; margin-bottom:6px;">🎨 Theme</div>

                            <div class="theme-option ${themeManager.get()==='dark'?'active':''}" onclick="themeManager.set('dark')">🌙 Dark</div>

                    <div class="settings-section">
                        <div style="font-weight:700; margin-bottom:6px;">💾 Backup</div>
                        <div style="display:flex; gap:8px;">
                            <button class="small-btn" onclick="downloadBackup()" style="flex:1;">📥 Download</button>
                            <button class="small-btn" onclick="document.getElementById('restoreFileInput').click()" style="flex:1;">📤 Restore</button>
                        </div>
                        <input type="file" id="restoreFileInput" accept=".json" style="display:none;" onchange="restoreBackup(this.files[0])">
                    </div>
                </div>`;
        }

        // ─────────────── Home Page ───────────────
        function renderHome(container) {
            container.innerHTML = `
                <div class="header">
                    <div class="header-left">
                        <span class="logo">📊</span>
                        <div>
                            <div class="title">Life Tracker</div>
                            <div class="subtitle">Track everything in one place</div>
                        </div>
                    </div>
                    <div class="header-actions">
                        <button class="icon-btn" onclick="toggleSettings()">⚙️</button>
                        <button class="icon-btn" onclick="cycleTheme()">🌓</button>
                    </div>
                </div>
                ${renderSettingsPanel()}
                <div class="home-grid">
                    <div class="home-card" onclick="navigateTo('habits')">
                        <div class="icon">✅</div>
                        <div class="card-title">Habit Tracker</div>
                        <div class="card-desc">Build better routines, one day at a time. Track daily habits with a monthly view.</div>

                    <div class="home-card" onclick="navigateTo('todo')">

                        <div class="card-title">To-Do Tracker</div>

                    </div>
                    <div class="home-card" onclick="navigateTo('expenses')">
                        <div class="icon">💰</div>

        // ─────────────── To-Do Tracker ───────────────
        function renderTodo(container) {
            const tasks = appData.todo.tasks[dateKey(selectedDate)] || [];
            const done = tasks.filter(t => t.done).length;
            const total = tasks.length;
            const percent = total > 0 ? Math.round((done/total)*100) : 0;

            container.innerHTML = `
                ${getHeaderHTML('To-Do Tracker', 'Plan your daily tasks', true, true, true)}
                ${renderSettingsPanel()}
                ${renderWeekStrip()}
                <div class="card">
                    <h2>${formatDate(selectedDate)}</h2>
                    <div class="date-label" style="color:var(--text-secondary); margin-bottom:16px;">${selectedDate.getFullYear()}</div>
                    <div id="todoTaskList" class="task-list">
                        ${tasks.length === 0 ? '<div style="text-align:center; color:var(--text-secondary); padding:20px;">No tasks for this day. Add one below 👇</div>' : ''}
                        ${tasks.map(t => `
                            <div class="task-item ${t.done ? 'done' : ''}" id="task-${t.id}">
                                <div class="task-radio" onclick="toggleTodoTask('${t.id}')"><div class="dot"></div></div>
                                <span class="task-text">${escapeHTML(t.text)}</span>
                                <button class="task-delete" onclick="deleteTodoTask('${t.id}')">×</button>
                            </div>
                        `).join('')}
                    </div>
                    <div class="add-row">
                        <input type="text" id="newTodoInput" placeholder="Add a new task..." maxlength="80" onkeypress="if(event.key==='Enter') addTodoTask()" />
                        <button class="btn btn-primary" onclick="addTodoTask()">Add</button>
                    </div>
                </div>
                <div class="stats-bar">
                    <div class="stat-card"><div class="stat-label">Today's Tasks</div><div class="stat-value">${total}</div></div>
                    <div class="stat-card"><div class="stat-label">Completed</div><div class="stat-value">${done}</div></div>
                    <div class="stat-card progress-card">
                        <div class="stat-label">Progress</div>
                        <div style="display:flex; align-items:center; gap:10px; margin-top:6px;">
                            <div style="flex:1; height:8px; background:var(--border); border-radius:10px; overflow:hidden;">
                                <div style="width:${percent}%; height:100%; background:var(--accent); border-radius:10px; transition:width 0.3s;"></div>
                            </div>
                            <span style="font-weight:700; color:var(--accent);">${percent}%</span>
                        </div>
                    </div>
                </div>
                <div class="card"><h3 style="margin-bottom:8px;">📊 Monthly Overview</h3><div class="chart-container"><canvas id="todoChart"></canvas></div></div>`;

            setTimeout(() => renderTodoChart(), 100);
        }

        function addTodoTask() {
            const input = document.getElementById('newTodoInput');
            if (!input) return;
            const text = input.value.trim();
            if (!text) return;
            const key = dateKey(selectedDate);
            if (!appData.todo.tasks[key]) appData.todo.tasks[key] = [];
            appData.todo.tasks[key].push({ id: Date.now().toString(36), text, done: false });
            input.value = '';
            saveData();
            render();
        }

        function toggleTodoTask(id) {
            const key = dateKey(selectedDate);
            const tasks = appData.todo.tasks[key] || [];
            const task = tasks.find(t => t.id === id);
            if (task) { task.done = !task.done; saveData(); render(); }
        }

        function deleteTodoTask(id) {
            if (!confirm('Delete this task?')) return;
            const key = dateKey(selectedDate);
            appData.todo.tasks[key] = (appData.todo.tasks[key] || []).filter(t => t.id !== id);
            saveData();
            render();
        }

        function renderTodoChart() {
            const ctx = document.getElementById('todoChart');
            if (!ctx) return;
            const month = selectedDate.getMonth();
            const year = selectedDate.getFullYear();
            const daysInMonth = new Date(year, month+1, 0).getDate();
            const data = [];
            for (let d=1; d<=daysInMonth; d++) {
                const key = dateKey(new Date(year, month, d));
                data.push((appData.todo.tasks[key] || []).filter(t => t.done).length);
            }
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Array.from({length: daysInMonth}, (_,i)=>i+1),
                    datasets: [{
                        label: 'Tasks done',
                        data,
                        backgroundColor: data.map((_,i) => {
                            const d = new Date(year, month, i+1);
                            return d.toDateString() === today.toDateString() ? 'rgba(224,185,74,0.8)' : 'rgba(74,111,165,0.5)';
                        }),
                        borderColor: data.map((_,i) => {
                            const d = new Date(year, month, i+1);
                            return d.toDateString() === today.toDateString() ? '#e0b94a' : '#4a6fa5';
                        }),
                        borderWidth: 1.5, borderRadius: 6
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { title: { display: true, text: 'Day of month' }, grid: { color: '#e8e3da' } },
                        y: { beginAtZero: true, title: { display: true, text: 'Completed' }, ticks: { stepSize:1 } }
                    }
                }
            });
        }

        // ─────────────── Habit Tracker ───────────────
        function renderHabits(container) {

            container.innerHTML = `
                ${getHeaderHTML('Habit Tracker', 'Build better routines', true, true)}
                ${renderSettingsPanel()}
                <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
                    <button class="nav-arrow" onclick="changeHabitMonth(-1)">◀</button>
                    <span style="font-weight:700; font-size:1rem;">${getMonthName(selectedDate.getMonth())} ${selectedDate.getFullYear()}</span>
                    <button class="nav-arrow" onclick="changeHabitMonth(1)">▶</button>
                </div>
                <div class="card" style="overflow-x:auto;">
                    <div style="display:grid; grid-template-columns: 160px repeat(${daysInMonth}, 36px) 120px; min-width:max-content;">
                        <div style="font-weight:700; padding:8px;">Habit</div>
                        ${Array.from({length: daysInMonth}, (_,i) => `<div style="text-align:center; font-size:0.7rem; padding:4px;">${i+1}</div>`).join('')}
                        <div style="font-weight:700; padding:8px;">Progress</div>
                        ${habits.map(h => {
                            const completed = (appData.habits.completions[h.id] || {});
                            let doneCount = 0;
                            for (let d=1; d<=daysInMonth; d++) {

                            return `
                                <div style="display:flex; align-items:center; gap:6px; padding:8px; font-weight:600;">
                                    <span style="width:10px;height:10px;border-radius:50%;background:${h.color};display:inline-block;"></span>
                                    ${escapeHTML(h.name)}
                                    <button style="opacity:0; font-size:0.7rem; background:none; border:none; color:var(--danger); cursor:pointer;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0" onclick="deleteHabit('${h.id}')">×</button>
                                </div>
                                ${Array.from({length: daysInMonth}, (_,i) => {
                                    const key = dateKey(new Date(selectedDate.getFullYear(), selectedDate.getMonth(), i+1));
                                    const isDone = completed[key];
                                    return `<div style="text-align:center; cursor:pointer; padding:4px;" onclick="toggleHabitDay('${h.id}', ${i+1})">
                                        <div style="width:26px;height:26px;border-radius:50%;border:2px solid ${isDone ? h.color : '#d5d0c7'};background:${isDone ? h.color : 'transparent'};display:flex;align-items:center;justify-content:center;margin:0 auto;">${isDone ? '✓' : ''}</div>
                                    </div>`;
                                }).join('')}
                                <div style="display:flex; align-items:center; gap:6px; padding:8px;">
                                    <div style="flex:1; height:6px; background:var(--border); border-radius:3px; overflow:hidden;">
                                        <div style="width:${percent}%; height:100%; background:${h.color}; border-radius:3px;"></div>
                                    </div>
                                    <span style="font-size:0.75rem; font-weight:700;">${percent}%</span>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
                <div class="add-row">
                    <input type="text" id="habitNameInput" placeholder="New habit name..." maxlength="30" />
                    <input type="color" id="habitColorInput" value="#4a6fa5" style="width:40px; height:40px; border:none; cursor:pointer;" />
                    <button class="btn btn-primary" onclick="addHabit()">Add Habit</button>
                </div>`;
        }

        function addHabit() {
            const name = document.getElementById('habitNameInput')?.value.trim();
            const color = document.getElementById('habitColorInput')?.value;
            if (!name) return;
            appData.habits.habits = appData.habits.habits || [];
            appData.habits.habits.push({ id: Date.now().toString(36), name, color });
            saveData();
            render();
        }

        function deleteHabit(id) {
            if (!confirm('Delete this habit?')) return;
            appData.habits.habits = appData.habits.habits.filter(h => h.id !== id);
            delete appData.habits.completions[id];
            saveData();
            render();
        }

        function toggleHabitDay(habitId, day) {
            const key = dateKey(new Date(selectedDate.getFullYear(), selectedDate.getMonth(), day));
            appData.habits.completions[habitId] = appData.habits.completions[habitId] || {};
            if (appData.habits.completions[habitId][key]) {
                delete appData.habits.completions[habitId][key];
            } else {
                appData.habits.completions[habitId][key] = true;
            }
            saveData();
            render();
        }

        function changeHabitMonth(delta) {
            selectedDate.setMonth(selectedDate.getMonth() + delta);
            render();
        }

        // ─────────────── Expense Tracker ───────────────
        function renderExpenses(container) {
            const month = selectedDate.getMonth();
            const year = selectedDate.getFullYear();
            const transactions = (appData.expenses.transactions || []).filter(t => {
                const d = new Date(t.date);
                return d.getMonth() === month && d.getFullYear() === year;
            }).sort((a,b) => new Date(b.date) - new Date(a.date));
            const income = transactions.filter(t => t.type === 'income').reduce((s,t) => s + t.amount, 0);
            const expenses = transactions.filter(t => t.type === 'expense').reduce((s,t) => s + t.amount, 0);
            const balance = income - expenses;

            container.innerHTML = `
                ${getHeaderHTML('Expense Tracker', 'Track your money', true)}
                ${renderSettingsPanel()}
                <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
                    <button class="nav-arrow" onclick="changeExpenseMonth(-1)">◀</button>
                    <span style="font-weight:700; font-size:1rem;">${getMonthName(month)} ${year}</span>
                    <button class="nav-arrow" onclick="changeExpenseMonth(1)">▶</button>
                </div>
                <div class="stats-bar">
                    <div class="stat-card"><div class="stat-label">Income</div><div class="stat-value" style="color:var(--success);">₹${income.toLocaleString()}</div></div>
                    <div class="stat-card"><div class="stat-label">Expenses</div><div class="stat-value" style="color:var(--danger);">₹${expenses.toLocaleString()}</div></div>
                    <div class="stat-card"><div class="stat-label">Balance</div><div class="stat-value" style="color:${balance>=0?'var(--success)':'var(--danger)'};">₹${balance.toLocaleString()}</div></div>

                <div class="card">
                    <h3 style="margin-bottom:12px;">Transactions</h3>
                    <div id="expenseList">

                        ${transactions.map(t => `
                            <div class="task-item">
                                <div style="flex:1;">
                                    <div style="font-weight:600;">${escapeHTML(t.description || 'No description')}</div>
                                    <div style="font-size:0.75rem; color:var(--text-secondary);">${new Date(t.date).toLocaleDateString()} · ${t.category || 'General'}</div>
                                </div>
                                <div class="expense-amount ${t.type === 'income' ? 'positive' : 'negative'}">
                                    ${t.type === 'income' ? '+' : '-'}₹${t.amount.toLocaleString()}
                                </div>
                                <button class="task-delete" style="opacity:0;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0" onclick="deleteExpense('${t.id}')">×</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div class="card">
                    <h3 style="margin-bottom:12px;">Add Transaction</h3>
                    <div class="add-row">
                        <input type="number" id="expenseAmount" placeholder="Amount" min="0" step="0.01" />
                        <input type="text" id="expenseDesc" placeholder="Description" maxlength="50" />
                        <select id="expenseType"><option value="expense">Expense</option><option value="income">Income</option></select>
                        <select id="expenseCategory">
                            <option>Food</option><option>Transport</option><option>Shopping</option><option>Bills</option><option>Entertainment</option><option>Health</option><option>Salary</option><option>Other</option>
                        </select>
                        <button class="btn btn-primary" onclick="addExpense()">Add</button>
                    </div>
                </div>`;
        }

        function addExpense() {
            const amount = parseFloat(document.getElementById('expenseAmount')?.value);
            const desc = document.getElementById('expenseDesc')?.value.trim() || 'No description';
            const type = document.getElementById('expenseType')?.value;
            const category = document.getElementById('expenseCategory')?.value;
            if (!amount || amount <= 0) return;
            appData.expenses.transactions = appData.expenses.transactions || [];
            appData.expenses.transactions.push({
                id: Date.now().toString(36),
                date: dateKey(selectedDate),
                amount,
                description: desc,
                type,
                category
            });
            saveData();
            render();
        }

        function deleteExpense(id) {
            if (!confirm('Delete this transaction?')) return;
            appData.expenses.transactions = appData.expenses.transactions.filter(t => t.id !== id);
            saveData();
            render();
        }

        function changeExpenseMonth(delta) {
            selectedDate.setMonth(selectedDate.getMonth() + delta);
            render();
        }

        // ─────────────── Week Strip (for Todo) ───────────────
        function renderWeekStrip() {
            const days = [];
            const start = new Date(weekCenter);
            start.setDate(start.getDate() - 3);
            for (let i=0; i<7; i++) {
                const d = new Date(start);
                d.setDate(start.getDate() + i);
                days.push(d);
            }
            return `
                <div class="week-strip">
                    <button class="nav-arrow" onclick="moveWeek(-1)">◀</button>
                    <div class="week-days">
                        ${days.map(d => {
                            const isToday = d.toDateString() === today.toDateString();
                            const isSelected = d.toDateString() === selectedDate.toDateString();
                            return `<div class="week-day ${isToday?'today':''} ${isSelected?'selected':''}" onclick="selectDate(new Date('${d.toISOString()}'))">
                                <div class="day-name">${d.toLocaleDateString('en-US',{weekday:'short'})}</div>
                                <div class="day-num">${d.getDate()}</div>
                            </div>`;
                        }).join('')}
                    </div>
                    <button class="nav-arrow" onclick="moveWeek(1)">▶</button>
                </div>`;
        }

        function selectDate(d) { selectedDate = new Date(d); weekCenter = new Date(d); render(); }
        function moveWeek(delta) { weekCenter.setDate(weekCenter.getDate() + delta*7); selectDate(weekCenter); }
        function goToToday() { selectedDate = new Date(today); weekCenter = new Date(today); render(); }

        // ─────────────── Settings ───────────────
        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            if (panel) panel.classList.toggle('show');
        }
        function toggleRecoveryId() {
            const container = document.getElementById('recoveryIdContainer');
            if (container) {
                container.style.display = container.style.display === 'none' ? 'flex' : 'none';
                document.getElementById('currentBlobId').value = blobId || '';
            }
        }
        function copyBlobId() {
            if (!blobId) return;
            navigator.clipboard.writeText(blobId).then(() => alert('Copied!'));
        }
        async function recoverWithId() {
            const input = document.getElementById('recoveryIdInput');
            const id = input?.value.trim();
            if (!id) return;
            blobId = id;
            saveBlobId(id);
            await loadFromCloud();
            saveData();
            render();
        }
        function downloadBackup() {
            const json = JSON.stringify(appData, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'life-tracker-backup.json';
            a.click();
            URL.revokeObjectURL(url);
        }
        function restoreBackup(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    appData = JSON.parse(e.target.result);
                    saveData();
                    render();
                    alert('✅ Backup restored!');
                } catch { alert('Invalid file.'); }
            };
            reader.readAsText(file);
        }
        function cycleTheme() {
            const themes = ['light', 'dark', 'system'];
            const current = themeManager.get();
            const idx = themes.indexOf(current);
            themeManager.set(themes[(idx+1)%3]);
            render();
        }

        // ─────────────── Reminders ───────────────
        let reminderInterval = null;
        let reminderActive = false;
        function toggleReminder() {
            if (reminderActive) { stopReminder(); } else { startReminder(); }
        }
        function startReminder() {
            if (!('Notification' in window)) return alert('Notifications not supported.');
            if (Notification.permission === 'denied') return alert('Permission denied. Enable in browser settings.');
            const request = () => {
                Notification.requestPermission().then(p => {
                    if (p === 'granted') enableReminder();
                });
            };
            if (Notification.permission === 'default') request();
            else if (Notification.permission === 'granted') enableReminder();
        }
        function enableReminder() {
            reminderActive = true;
            if (reminderInterval) clearInterval(reminderInterval);
            reminderInterval = setInterval(checkPendingAndNotify, 30*60*1000);
            checkPendingAndNotify();
        }
        function stopReminder() {
            reminderActive = false;
            if (reminderInterval) { clearInterval(reminderInterval); reminderInterval = null; }
        }
        function checkPendingAndNotify() {
            if (!reminderActive) return;
            const key = dateKey(today);
            const tasks = appData.todo.tasks[key] || [];
            const pending = tasks.filter(t => !t.done);
            if (pending.length === 0) return;
            if (Notification.permission !== 'granted') return;
            if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
                navigator.serviceWorker.ready.then(r => {
                    r.showNotification('⏳ Tasks pending', {
                        body: `You have ${pending.length} task(s) to complete`,
                        icon: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Crect width="100" height="100" rx="20" fill="%234a6fa5"/%3E%3Ccircle cx="35" cy="40" r="12" fill="white"/%3E%3Ccircle cx="65" cy="40" r="12" fill="white"/%3E%3Ccircle cx="50" cy="65" r="12" fill="white"/%3E%3C/svg%3E',
                        tag: 'life-tracker-reminder',
                        requireInteraction: true,
                        vibrate: [200, 100, 200]
                    });
                });
            }
        }

        function escapeHTML(s) {
            return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m]);
        }

        // ─────────────── Init ───────────────
        async function init() {
            const savedId = getSavedBlobId();
            if (savedId) {
                blobId = savedId;
                await loadFromCloud();
            } else {
                try {
                    blobId = await createBlob(appData);
                    saveBlobId(blobId);
                    updateSyncUI('online', 'Online');
                } catch(e) {
                    console.warn('Could not create cloud blob');
                    updateSyncUI('offline', 'Offline');
                }
            }
            // Load local backup if cloud empty
            const local = localStorage.getItem('lifeTrackerLocal');
            if (local && (!appData || Object.keys(appData.todo?.tasks || {}).length === 0)) {
                try { appData = JSON.parse(local); } catch(e){}
            }
            saveData();
            render();
        }

        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        init();
    </script>
</body>
</html>
