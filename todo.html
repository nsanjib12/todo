<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>To-Do Tracker</title>
    <meta name="theme-color" content="#4a6fa5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%234a6fa5'/%3E%3Crect x='30' y='20' width='40' height='55' rx='5' fill='white'/%3E%3Crect x='38' y='30' width='24' height='4' rx='2' fill='%234a6fa5'/%3E%3Crect x='38' y='40' width='24' height='4' rx='2' fill='%234a6fa5'/%3E%3Crect x='38' y='50' width='16' height='4' rx='2' fill='%234a6fa5'/%3E%3Cpolyline points='42,62 47,67 57,57' fill='none' stroke='%234a6fa5' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #f5f3ef; --card-bg: #ffffff; --text: #1e1e1e; --text-secondary: #6e6e6e;
            --border: #e0dcd4; --accent: #4a6fa5; --shadow: 0 2px 14px rgba(0,0,0,0.05); --radius: 14px;
            --font: 'Inter', 'Segoe UI', system-ui, sans-serif; --danger: #e74c3c; --success: #2ecc71;
            --input-bg: #fafaf7; --hover-bg: #f0ede6;
        }
        [data-theme="dark"] {
            --bg: #1a1a2e; --card-bg: #16213e; --text: #e0e0e0; --text-secondary: #a0a0a0;
            --border: #2a2a4a; --shadow: 0 2px 14px rgba(0,0,0,0.3); --input-bg: #1a1a2e; --hover-bg: #2a2a4a;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; min-height: 100dvh; padding: 12px; transition: background 0.3s, color 0.3s; }
        .app { max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        .header { display: flex; align-items: center; gap: 10px; background: var(--card-bg); padding: 10px 14px; border-radius: var(--radius); box-shadow: var(--shadow); }
        .back-btn { background: none; border: none; cursor: pointer; font-size: 1.4rem; color: var(--accent); padding: 4px 8px; border-radius: 8px; text-decoration: none; }
        .back-btn:hover { background: var(--hover-bg); }
        .header-title { font-size: 1.15rem; font-weight: 700; flex: 1; display: flex; align-items: center; gap: 8px; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .date-display { font-size: 1rem; font-weight: 700; color: var(--text); cursor: pointer; padding: 4px 12px; border-radius: 10px; text-align: right; }
        .date-display:hover { background: var(--hover-bg); }
        .date-display .day-name { font-size: 0.7rem; color: var(--text-secondary); font-weight: 500; display: block; }
        .calendar-icon { background: none; border: none; cursor: pointer; font-size: 1.5rem; padding: 6px; border-radius: 10px; color: var(--accent); }
        .calendar-icon:hover { background: var(--hover-bg); }
        .add-btn { background: var(--accent); border: none; cursor: pointer; font-size: 1.3rem; width: 36px; height: 36px; border-radius: 10px; color: #fff; display: flex; align-items: center; justify-content: center; }
        .add-btn:hover { opacity: 0.85; }
        .card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; }
        .task-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--input-bg); margin-bottom: 4px; transition: 0.2s; }
        .task-item:hover { background: var(--hover-bg); }
        .task-radio { width: 24px; height: 24px; border-radius: 50%; border: 2.5px solid #d5d0c7; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; background: var(--card-bg); flex-shrink: 0; }
        .task-item.done .task-radio { border-color: transparent; background: var(--accent); }
        .task-radio .dot { width: 9px; height: 9px; border-radius: 50%; background: #fff; transform: scale(0); transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1); }
        .task-item.done .task-radio .dot { transform: scale(1); }
        .task-text { flex: 1; font-size: 0.95rem; font-weight: 600; }
        .task-item.done .task-text { text-decoration: line-through; color: var(--text-secondary); }
        .delete-btn { background: none; border: none; cursor: pointer; color: var(--danger); font-size: 1rem; font-weight: 700; opacity: 0; transition: 0.2s; padding: 4px 8px; border-radius: 6px; }
        .task-item:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { background: #fce8e8; }
        .stats-bar { display: flex; gap: 8px; }
        .stat-card { background: var(--card-bg); padding: 12px 14px; border-radius: var(--radius); box-shadow: var(--shadow); text-align: center; flex: 1; min-width: 80px; }
        .stat-value { font-size: 1.3rem; font-weight: 800; color: var(--accent); }
        .stat-label { font-size: 0.65rem; color: var(--text-secondary); text-transform: uppercase; }
        .chart-container { height: 180px; }
        .hidden-date-input { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; display: flex; align-items: flex-start; justify-content: center; padding-top: 20px; overflow-y: auto; }
        .modal-box { background: var(--card-bg); border-radius: 16px; padding: 20px; width: 90%; max-width: 400px; text-align: center; color: var(--text); box-shadow: 0 12px 40px rgba(0,0,0,0.2); margin-bottom: 20px; animation: slideDown 0.25s ease; }
        @keyframes slideDown { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-box h3 { font-size: 1.1rem; margin-bottom: 16px; }
        .modal-row { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
        .modal-row input { flex: 1; padding: 12px 16px; border-radius: 24px; border: 1.5px solid var(--border); font-family: var(--font); background: var(--input-bg); color: var(--text); font-size: 0.95rem; }
        .modal-row input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(74,111,165,0.1); }
        .modal-actions { display: flex; gap: 8px; justify-content: center; margin-top: 16px; }
        .btn { padding: 10px 18px; border-radius: 22px; border: none; cursor: pointer; font-weight: 600; font-size: 0.85rem; display: flex; align-items: center; gap: 5px; font-family: var(--font); transition: 0.2s; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-outline { background: var(--card-bg); color: var(--text); border: 1.5px solid var(--border); }
        .btn-outline:hover { background: var(--hover-bg); }
        @media (max-width: 500px) { .chart-container { height: 160px; } .header { padding: 10px 12px; } .date-display { font-size: 0.9rem; } }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <a href="index.html" class="back-btn" title="Back">←</a>
            <div class="header-title"><span style="font-size:1.3rem;">✅</span> To-Do Tracker</div>
            <div class="header-right">
                <button class="add-btn" onclick="openAddTaskModal()" title="Add new task">+</button>
                <div class="date-display" id="dateDisplay" onclick="openDatePicker()">
                    <span class="day-name" id="dayNameDisplay"></span>
                    <span id="dateNumDisplay"></span>
                </div>
                <button class="calendar-icon" onclick="goToToday()" title="Go to today">📅</button>
            </div>
            <input type="date" id="datePicker" class="hidden-date-input" onchange="onDateChange(this.value)">
        </div>

        <div class="card">
            <h3 style="margin-bottom:10px; font-size:0.9rem;">Tasks</h3>
            <div id="taskList"></div>
        </div>
        <div class="stats-bar" id="statsBar"></div>
        <div class="card"><h3 style="margin-bottom:8px; font-size:0.9rem;">📊 Monthly Overview</h3><div class="chart-container"><canvas id="todoChart"></canvas></div></div>
    </div>

    <div class="modal-overlay" id="addTaskModal" style="display:none;" onclick="if(event.target===this) closeAddTaskModal()">
        <div class="modal-box">
            <h3>➕ Add New Task</h3>
            <div class="modal-row">
                <input type="text" id="newTaskInput" placeholder="What do you need to do?" maxlength="80" onkeypress="if(event.key==='Enter') addTask()">
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeAddTaskModal()">Cancel</button>
                <button class="btn btn-primary" onclick="addTask()">Add Task</button>
            </div>
        </div>
    </div>

    <script src="shared.js"></script>
    <script>
        let selectedDate = new Date(); const today = new Date(); today.setHours(0,0,0,0);
        let chartInstance = null;

        function openDatePicker() { document.getElementById('datePicker').showPicker ? document.getElementById('datePicker').showPicker() : document.getElementById('datePicker').click(); }
        function openAddTaskModal() { document.getElementById('addTaskModal').style.display = 'flex'; document.getElementById('newTaskInput').value = ''; document.getElementById('newTaskInput').focus(); document.body.style.overflow = 'hidden'; document.body.style.position = 'fixed'; document.body.style.width = '100%'; }
        function closeAddTaskModal() { document.getElementById('addTaskModal').style.display = 'none'; document.body.style.overflow = ''; document.body.style.position = ''; document.body.style.width = ''; }

        function render() {
            document.getElementById('datePicker').value = selectedDate.toISOString().split('T')[0];
            document.getElementById('dayNameDisplay').textContent = selectedDate.toLocaleDateString('en-US', { weekday: 'short' });
            document.getElementById('dateNumDisplay').textContent = selectedDate.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
            const tasks = getTasks(selectedDate);
            const done = tasks.filter(t=>t.done).length, total = tasks.length;
            document.getElementById('taskList').innerHTML = tasks.length === 0 ? '<div style="text-align:center;color:var(--text-secondary);padding:15px;">No tasks yet. Tap <strong>+</strong> to add one!</div>' : tasks.map(t=>`<div class="task-item ${t.done?'done':''}"><div class="task-radio" onclick="toggleTask('${t.id}')"><div class="dot"></div></div><span class="task-text">${escapeHTML(t.text)}</span><button class="delete-btn" onclick="deleteTask('${t.id}')">×</button></div>`).join('');
            document.getElementById('statsBar').innerHTML = `<div class="stat-card"><div class="stat-label">Tasks</div><div class="stat-value">${total}</div></div><div class="stat-card"><div class="stat-label">Done</div><div class="stat-value">${done}</div></div><div class="stat-card"><div class="stat-label">Progress</div><div class="stat-value">${total?Math.round(done/total*100):0}%</div></div>`;
            renderChart();
        }
        function getTasks(d) { return appData.todo.tasks[dateKey(d)] || []; }
        function setTasks(d, tasks) { appData.todo.tasks[dateKey(d)] = tasks; }
        
        function addTask() {
            const input = document.getElementById('newTaskInput'); if(!input) return;
            const t = input.value.trim(); if(!t) { input.focus(); return; }
            const id = Date.now().toString(36);
            const tasks = getTasks(selectedDate);
            tasks.push({id, text:t, done:false});
            setTasks(selectedDate, tasks);
            saveData(); // ← Changed from queueUpsert
            closeAddTaskModal(); render();
        }
        function toggleTask(id) {
               const tasks = getTasks(selectedDate);
                const task = tasks.find(t=>t.id===id);
                if(task){
                    task.done=!task.done;
                    setTasks(selectedDate, tasks);
                    saveData(); // ← Changed from queueUpsert
                    render();
                }
        }
        function deleteTask(id) {
            if(!confirm('Delete?')) return;
            const tasks = getTasks(selectedDate).filter(t=>t.id!==id);
            setTasks(selectedDate, tasks);
            saveData(); // ← Changed from queueDelete
            render();
        }
        function onDateChange(v) { selectedDate = new Date(v+'T00:00:00'); render(); }
        function goToToday() { selectedDate = new Date(today); render(); }
        function renderChart() {
            const ctx = document.getElementById('todoChart'); if(!ctx) return;
            if(chartInstance) chartInstance.destroy();
            const m=selectedDate.getMonth(), y=selectedDate.getFullYear(), dim=new Date(y,m+1,0).getDate();
            const data = []; for(let d=1; d<=dim; d++) data.push(getTasks(new Date(y,m,d)).filter(t=>t.done).length);
            chartInstance = new Chart(ctx, { type:'bar', data:{labels:Array.from({length:dim},(_,i)=>i+1), datasets:[{data,backgroundColor:'rgba(74,111,165,0.6)',borderColor:'#4a6fa5',borderWidth:1,borderRadius:4}]}, options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#e8e3da'}},y:{beginAtZero:true,ticks:{stepSize:1}}}} });
        }

        initSync();
        render();
    </script>
</body>
</html>
