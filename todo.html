<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>To-Do Tracker</title>
    <meta name="theme-color" content="#4a6fa5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%234a6fa5'/%3E%3Crect x='30' y='20' width='40' height='55' rx='5' fill='white'/%3E%3Crect x='38' y='30' width='24' height='4' rx='2' fill='%234a6fa5'/%3E%3Crect x='38' y='40' width='24' height='4' rx='2' fill='%234a6fa5'/%3E%3Crect x='38' y='50' width='16' height='4' rx='2' fill='%234a6fa5'/%3E%3Cpolyline points='42,62 47,67 57,57' fill='none' stroke='%234a6fa5' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #f5f3ef; --card-bg: #ffffff; --text: #1e1e1e; --text-secondary: #6e6e6e;
            --border: #e0dcd4; --accent: #4a6fa5; --shadow: 0 2px 14px rgba(0,0,0,0.05); --radius: 14px;
            --font: 'Inter', 'Segoe UI', system-ui, sans-serif; --danger: #e74c3c; --success: #2ecc71;
            --input-bg: #fafaf7; --hover-bg: #f0ede6;
        }
        [data-theme="dark"] {
            --bg: #1a1a2e; --card-bg: #16213e; --text: #e0e0e0; --text-secondary: #a0a0a0;
            --border: #2a2a4a; --shadow: 0 2px 14px rgba(0,0,0,0.3); --input-bg: #1a1a2e; --hover-bg: #2a2a4a;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; padding: 12px; }
        .app { max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        .header { display: flex; align-items: center; gap: 10px; background: var(--card-bg); padding: 10px 14px; border-radius: var(--radius); box-shadow: var(--shadow); }
        .back-btn { background: none; border: none; cursor: pointer; font-size: 1.4rem; color: var(--accent); text-decoration: none; }
        .header-title { font-size: 1.15rem; font-weight: 700; flex: 1; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .date-display { font-size: 1rem; font-weight: 700; cursor: pointer; }
        .calendar-icon { background: none; border: none; cursor: pointer; font-size: 1.5rem; color: var(--accent); }
        .add-btn { background: var(--accent); border: none; cursor: pointer; font-size: 1.3rem; width: 36px; height: 36px; border-radius: 10px; color: #fff; }
        .card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; }
        .task-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--input-bg); margin-bottom: 4px; }
        .task-radio { width: 24px; height: 24px; border-radius: 50%; border: 2.5px solid #d5d0c7; cursor: pointer; }
        .task-item.done .task-radio { background: var(--accent); border-color: var(--accent); }
        .task-text { flex: 1; font-size: 0.95rem; font-weight: 600; }
        .task-item.done .task-text { text-decoration: line-through; color: var(--text-secondary); }
        .delete-btn { background: none; border: none; cursor: pointer; color: var(--danger); font-size: 1rem; }
        .stats-bar { display: flex; gap: 8px; }
        .stat-card { background: var(--card-bg); padding: 12px 14px; border-radius: var(--radius); box-shadow: var(--shadow); text-align: center; flex: 1; }
        .stat-value { font-size: 1.3rem; font-weight: 800; color: var(--accent); }
        .stat-label { font-size: 0.65rem; color: var(--text-secondary); }
        .chart-container { height: 180px; }
        .hidden-date-input { position: absolute; opacity: 0; width: 0; height: 0; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; display: flex; align-items: flex-start; justify-content: center; padding-top: 20px; }
        .modal-box { background: var(--card-bg); border-radius: 16px; padding: 20px; width: 90%; max-width: 400px; }
        .modal-box h3 { font-size: 1.1rem; margin-bottom: 16px; }
        .modal-row { display: flex; gap: 10px; margin-bottom: 14px; }
        .modal-row input { flex: 1; padding: 12px 16px; border-radius: 24px; border: 1.5px solid var(--border); font-size: 0.95rem; }
        .modal-actions { display: flex; gap: 8px; justify-content: center; }
        .btn { padding: 10px 18px; border-radius: 22px; border: none; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-outline { background: var(--card-bg); color: var(--text); border: 1.5px solid var(--border); }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <a href="index.html" class="back-btn">←</a>
            <div class="header-title">✅ To-Do Tracker</div>
            <div class="header-right">
                <button class="add-btn" onclick="openAddTaskModal()">+</button>
                <div class="date-display" id="dateDisplay" onclick="openDatePicker()"></div>
                <button class="calendar-icon" onclick="goToToday()">📅</button>
            </div>
            <input type="date" id="datePicker" class="hidden-date-input" onchange="onDateChange(this.value)">
        </div>

        <div class="card">
            <div id="taskList"></div>
        </div>
        <div class="stats-bar" id="statsBar"></div>
        <div class="card"><canvas id="todoChart"></canvas></div>
    </div>

    <div class="modal-overlay" id="addTaskModal" style="display:none;">
        <div class="modal-box">
            <h3>➕ Add New Task</h3>
            <div class="modal-row">
                <input type="text" id="newTaskInput" placeholder="What do you need to do?" onkeypress="if(event.key==='Enter') addTask()">
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeAddTaskModal()">Cancel</button>
                <button class="btn btn-primary" onclick="addTask()">Add</button>
            </div>
        </div>
    </div>

    <script src="shared.js"></script>
    <script>
        let selectedDate = new Date();
        let chartInstance = null;

        function openDatePicker() { document.getElementById('datePicker').showPicker ? document.getElementById('datePicker').showPicker() : document.getElementById('datePicker').click(); }
        function openAddTaskModal() { document.getElementById('addTaskModal').style.display = 'flex'; document.getElementById('newTaskInput').focus(); }
        function closeAddTaskModal() { document.getElementById('addTaskModal').style.display = 'none'; }

        function render() {
            document.getElementById('datePicker').value = selectedDate.toISOString().split('T')[0];
            document.getElementById('dateDisplay').textContent = selectedDate.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short' });
            const tasks = getTasks(selectedDate);
            document.getElementById('taskList').innerHTML = tasks.length === 0 ? '<div style="text-align:center;color:var(--text-secondary);padding:15px;">No tasks. Tap + to add.</div>' : tasks.map(t => `<div class="task-item ${t.done?'done':''}"><div class="task-radio" onclick="toggleTask('${t.id}')"></div><span class="task-text">${escapeHTML(t.text)}</span><button class="delete-btn" onclick="deleteTask('${t.id}')">×</button></div>`).join('');
            const done = tasks.filter(t=>t.done).length;
            document.getElementById('statsBar').innerHTML = `<div class="stat-card"><div class="stat-label">Tasks</div><div class="stat-value">${tasks.length}</div></div><div class="stat-card"><div class="stat-label">Done</div><div class="stat-value">${done}</div></div>`;
            renderChart();
        }

        function getTasks(d) { return appData.todo.tasks[dateKey(d)] || []; }
        function setTasks(d, tasks) { appData.todo.tasks[dateKey(d)] = tasks; saveDataLocal(); }

        function addTask() {
            const input = document.getElementById('newTaskInput');
            const t = input.value.trim(); if (!t) return;
            const tasks = getTasks(selectedDate);
            tasks.push({ id: Date.now().toString(36), text: t, done: false });
            setTasks(selectedDate, tasks);
            closeAddTaskModal(); render();
        }
        function toggleTask(id) {
            const tasks = getTasks(selectedDate);
            const task = tasks.find(t => t.id === id);
            if (task) { task.done = !task.done; setTasks(selectedDate, tasks); render(); }
        }
        function deleteTask(id) {
            setTasks(selectedDate, getTasks(selectedDate).filter(t => t.id !== id));
            render();
        }
        function onDateChange(v) { selectedDate = new Date(v + 'T00:00:00'); render(); }
        function goToToday() { selectedDate = new Date(); render(); }
        function renderChart() {
            const ctx = document.getElementById('todoChart'); if (!ctx) return;
            if (chartInstance) chartInstance.destroy();
            const m = selectedDate.getMonth(), y = selectedDate.getFullYear(), dim = new Date(y, m+1, 0).getDate();
            const data = []; for (let d = 1; d <= dim; d++) data.push(getTasks(new Date(y, m, d)).filter(t => t.done).length);
            chartInstance = new Chart(ctx, { type: 'bar', data: { labels: Array.from({length: dim}, (_,i)=>i+1), datasets: [{ data, backgroundColor: 'rgba(74,111,165,0.6)', borderRadius: 4 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } } });
        }

        initSync();
        render();
    </script>
</body>
</html>
